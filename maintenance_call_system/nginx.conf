# ── MCS — Maintenance Call System — Nginx Config ─────────────────────────────
#
# Install:   sudo cp nginx.conf /etc/nginx/sites-available/mcs
#            sudo ln -s /etc/nginx/sites-available/mcs /etc/nginx/sites-enabled/mcs
#            sudo nginx -t && sudo systemctl reload nginx
#
# For multiple sites, copy this file and change:
#   - server_name   (e.g. mcs-plant1, mcs-chicago)
#   - upstream ports (if running multiple instances on the same host)
#   - static alias path
#
# SSL: sudo certbot --nginx -d mcs.yourdomain.com
# ──────────────────────────────────────────────────────────────────────────────

upstream mcs_backend {
    server 127.0.0.1:4001;
    keepalive 32;
}

upstream mcs_frontend {
    server 127.0.0.1:3003;
    keepalive 16;
}

server {
    listen 80;
    server_name mcs mcs.local _;   # replace with your hostname or IP

    # ── Next.js static assets — served directly by Nginx (fastest path) ───────
    location /_next/static/ {
        alias /opt/mcs/frontend/.next/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Public static files (images, icons, etc.) ─────────────────────────────
    location /static/ {
        alias /opt/mcs/frontend/public/;
        expires 7d;
        access_log off;
    }

    # ── Socket.io WebSocket upgrade ───────────────────────────────────────────
    location /socket.io/ {
        proxy_pass         http://mcs_backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
    }

    # ── MCS REST API ──────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://mcs_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # ── Health check (bypasses rate limiting) ─────────────────────────────────
    location /health {
        proxy_pass http://mcs_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # ── Next.js SSR app ───────────────────────────────────────────────────────
    location / {
        proxy_pass         http://mcs_frontend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "keep-alive";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 30s;
    }

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Gzip compression ──────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1000;
}
